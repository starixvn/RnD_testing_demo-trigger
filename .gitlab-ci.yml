build1:
  stage: build
  script:
    - echo "BUILD_VERSION=hello" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    when: always


deploy:
  stage: deploy
  script:
    - echo $BUILD_VERSION # => hello
  dependencies: 
    -  build1
  artifacts:
    paths:
      - ./   
    when: always
